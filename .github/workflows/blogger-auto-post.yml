name: Blogger Auto Post

on:
  schedule:
    # Monday-Friday near 07:00 KST. 06:50 KST = Sunday-Thursday 21:50 UTC.
    - cron: "50 21 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogger-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate required secrets
        shell: python
        env:
          MANUAL_PROMPT_MODE: ${{ vars.MANUAL_PROMPT_MODE || 'true' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          import os

          if os.environ.get("MANUAL_PROMPT_MODE", "true").lower() == "true":
              missing = []
          else:
              missing = [
                  name
                  for name in (
                      "OPENAI_API_KEY",
                      "BLOGGER_BLOG_ID",
                      "GOOGLE_CLIENT_SECRET_JSON",
                      "GOOGLE_TOKEN_JSON",
                  )
                  if not os.environ.get(name, "").strip()
              ]
          if missing:
              raise SystemExit("Missing required GitHub Secrets: " + ", ".join(missing))

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore Google OAuth files
        if: ${{ (vars.MANUAL_PROMPT_MODE || 'true') != 'true' }}
        shell: python
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          import os
          from pathlib import Path

          Path("client_secret.json").write_text(os.environ["GOOGLE_CLIENT_SECRET_JSON"].strip(), encoding="utf-8")
          Path("token.json").write_text(os.environ["GOOGLE_TOKEN_JSON"].strip(), encoding="utf-8")

      - name: Run RSS Blogger auto post
        env:
          RUN_NOW: "true"
          MANUAL_PROMPT_MODE: ${{ vars.MANUAL_PROMPT_MODE || 'true' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-4o-mini"
          OPENAI_TEMPERATURE: ${{ vars.OPENAI_TEMPERATURE || '0.2' }}
          MAX_OPENAI_OUTPUT_TOKENS: ${{ vars.MAX_OPENAI_OUTPUT_TOKENS || '1500' }}
          RSS_FEED_URLS: ${{ vars.RSS_FEED_URLS }}
          MAX_ARTICLE_CHARS: ${{ vars.MAX_ARTICLE_CHARS || '2500' }}
          MAX_SUMMARY_INPUT_CHARS: ${{ vars.MAX_SUMMARY_INPUT_CHARS || '1200' }}
          MIN_CLEAN_ARTICLE_CHARS: ${{ vars.MIN_CLEAN_ARTICLE_CHARS || '400' }}
          LIMITED_SOURCE_CHARS: ${{ vars.LIMITED_SOURCE_CHARS || '800' }}
          MIN_MEANINGFUL_SENTENCES: ${{ vars.MIN_MEANINGFUL_SENTENCES || '4' }}
          MIN_CONTENT_QUALITY_SCORE: ${{ vars.MIN_CONTENT_QUALITY_SCORE || '45' }}
          MAX_RELATED_LINKS: ${{ vars.MAX_RELATED_LINKS || '3' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '1' }}
          REQUIRE_POST_SUCCESS: ${{ vars.REQUIRE_POST_SUCCESS || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          PUBLISH_STATUS: ${{ vars.PUBLISH_STATUS || 'draft' }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_SECRET_FILE: "client_secret.json"
          GOOGLE_TOKEN_FILE: "token.json"
        run: python sp500_issue_blog_bot.py

      - name: Upload DRY_RUN output
        if: ${{ vars.DRY_RUN == 'true' || (vars.MANUAL_PROMPT_MODE || 'true') == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-output
          path: output/
          if-no-files-found: ignore

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary
          path: run_summary.json
          if-no-files-found: ignore

      - name: Commit history and run summary
        if: ${{ vars.DRY_RUN != 'true' && (vars.MANUAL_PROMPT_MODE || 'true') != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f history.json && git add history.json
          test -f run_summary.json && git add run_summary.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: update auto post history [skip ci]"
            git push
          fi
