name: Blogger Auto Post

on:
  schedule:
    # 07:30 Korea Standard Time = 22:30 UTC on the previous day.
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: blogger-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore Google OAuth files
        shell: python
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          import os
          from pathlib import Path

          required = {
              "GOOGLE_CLIENT_SECRET_JSON": "client_secret.json",
              "GOOGLE_TOKEN_JSON": "token.json",
          }

          for secret_name, output_name in required.items():
              value = os.environ.get(secret_name, "").strip()
              if not value:
                  raise SystemExit(f"Missing GitHub secret: {secret_name}")
              Path(output_name).write_text(value, encoding="utf-8")

      - name: Run Blogger auto post
        env:
          RUN_NOW: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
          BLOG_PLATFORM: "blogger"
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_LABELS: ${{ vars.BLOGGER_LABELS || 'S&P 500,US Stocks,Wall Street,Earnings' }}
          PUBLISH_STATUS: ${{ vars.PUBLISH_STATUS || 'draft' }}
          MAX_COMPANIES: ${{ vars.MAX_COMPANIES || '3' }}
          SCAN_LIMIT: ${{ vars.SCAN_LIMIT }}
          SKIP_IF_NO_ISSUES: ${{ vars.SKIP_IF_NO_ISSUES || 'true' }}
          GOOGLE_CLIENT_SECRET_FILE: "client_secret.json"
          GOOGLE_TOKEN_FILE: "token.json"
        run: python sp500_issue_blog_bot.py
